<template>
    <lightning-card title="Smart Property & Service Management Dashboard" icon-name="standard:service_contract">
        <div class="slds-m-around_medium">
            
            <!-- Metrics Summary Section -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_default slds-text-align_center">
                        <p class="slds-text-heading_small">Total Requests</p>
                        <p class="slds-text-heading_large slds-text-color_default">{totalRequests}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_default slds-text-align_center">
                        <p class="slds-text-heading_small">New</p>
                        <p class="slds-text-heading_large slds-text-color_error">{newRequests}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_default slds-text-align_center">
                        <p class="slds-text-heading_small">In Progress</p>
                        <p class="slds-text-heading_large slds-text-color_warning">{inProgressRequests}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_default slds-text-align_center">
                        <p class="slds-text-heading_small">Resolved</p>
                        <p class="slds-text-heading_large slds-text-color_success">{resolvedRequests}</p>
                    </div>
                </div>
            </div>

            <!-- Service Requests Data Table -->
            <div style="height: 350px;">
                <lightning-datatable
                    key-field="Id"
                    data={requests}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>

        </div>
    </lightning-card>
</template>
